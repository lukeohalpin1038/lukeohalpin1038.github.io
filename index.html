<script>
const KEY='frc-prescout-2027',NOW=2026,TARGET=2027;
const CR=[['scoring','Scoring'],['auto','Auto'],['endgame','Endgame'],['rel','Reliability'],['def','Defense'],['dt','Drive team']];
const WL=CR.concat([['epa','EPA vs season top'],['proj','Projected 2027 strength']]);
const DEF_W={scoring:3,auto:2,endgame:2,rel:3,def:1,dt:2,epa:2,proj:1};
const DEF_AP={pal:'default',a:'#6ea0ff',b:'#a98bff',size:'m',font:'default',dens:'cozy',round:'rounded',bg:'plain',bg0:'',logo:true};
const DEF_FAV=document.querySelector('#fav')?document.querySelector('#fav').href:'';
const TIERS=[['','Unsorted'],['top','Top pick'],['solid','Solid'],['maybe','Maybe'],['avoid','Avoid']];
const tierName=k=>(TIERS.find(t=>t[0]===k)||['',''])[1];
let S={teams:[],events:[],w:Object.assign({},DEF_W),top:{},topEst:{},cmpMode:'teams',al:[['','',''],['','','']],on:true,vnotes:{},seen:{},queue:[],qi:0,theme:'dark',
  sort:'num',q:'',tier:'all',tab:'board',sub:'',page:0,back:'board',pgy:null,ap:Object.assign({},DEF_AP),icon:'',collapsed:{},evi:{},me:'',cmp:['','',''],vsrc:'team',vteam:'',vyear:NOW,vt:{best:true,worst:true,upset:true,all:false}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const r1=v=>v==null||isNaN(v)?null:Math.round(v*10)/10;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

// ---------- storage ----------
function load(d){
  S.teams=d.teams||[];S.events=d.events||[];Object.assign(S.w,d.w||{});
  S.vnotes=d.vnotes||{};S.seen=d.seen||{};S.queue=d.queue||[];S.qi=d.qi||0;S.theme=d.theme||'dark';S.ap=Object.assign({},DEF_AP,d.ap||{});S.icon=d.icon||'';S.collapsed=d.collapsed||{};S.evi=d.evi||{};S.me=typeof d.me==='string'?d.me.slice(0,60):'';
  if((d.v||1)<2){for(const t of S.teams){delete t.m13;delete t.hist}S.top={};S.topEst={};S.on=true}   // old xP data is replaced by Statbotics EPA
  else{S.top=d.top||{};S.topEst=d.topEst||{};S.on=d.on!==false}
  for(const t of S.teams){if(typeof t.epa!=='number')t.epa='';if(!t.r)t.r={}}
  if((d.v||1)<3)for(const t of S.teams)for(const k in t.r)if(t.r[k]>0)t.r[k]=Math.min(100,Math.round(t.r[k]*20));   // ratings moved from 1-5 to 1-100
}
function save(){try{localStorage.setItem(KEY,JSON.stringify({v:3,teams:S.teams,events:S.events,w:S.w,top:S.top,topEst:S.topEst,on:S.on,vnotes:S.vnotes,seen:S.seen,queue:S.queue,qi:S.qi,theme:S.theme,ap:S.ap,icon:S.icon,collapsed:S.collapsed,evi:S.evi,me:S.me}))}catch(e){}}
try{const r=localStorage.getItem(KEY);if(r)load(JSON.parse(r))}catch(e){}
const PALS={ocean:['#2f9bff','#2ed3b7'],sunset:['#ff7a45','#e0489d'],forest:['#3fbf7f','#a6d63f'],royal:['#7a5cff','#ff5cc8'],slate:['#8a94b8','#c6cde8']};
const FONTS={default:'',system:'system-ui,-apple-system,"Segoe UI",Roboto,sans-serif',serif:'Georgia,"Times New Roman",serif',mono:'ui-monospace,Menlo,Consolas,monospace'};
const SIZES={s:'13px',m:'',l:'17px'},DENS={cozy:['',''],compact:['8px','4px 8px'],roomy:['20px','13px 14px']},ROUND={sharp:['2px','2px'],rounded:['',''],soft:['16px','12px']};
const DARKS=[['Black','#000000'],['Charcoal','#17181c'],['Slate','#111b27'],['Midnight blue','#0a1230'],['Deep purple','#150f26'],['Forest','#0e1a14'],['Wine','#1f0f17']];
const okHex=x=>/^#[0-9a-f]{6}$/i.test(x||'');
function lum(hex){const n=parseInt(hex.slice(1),16);const c=[n>>16&255,n>>8&255,n&255].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function applyAppearance(){
  applyTheme();
  const st=document.documentElement.style,a=S.ap,set=(k,v)=>v?st.setProperty(k,v):st.removeProperty(k);
  let c1='',c2='';
  if(a.pal==='custom'){c1=a.a;c2=a.b}else if(PALS[a.pal]){c1=PALS[a.pal][0];c2=PALS[a.pal][1]}
  if(okHex(c1)&&okHex(c2)){set('--accent',c1);set('--accent2',c2);set('--hi',c2);set('--on',(lum(c1)+lum(c2))/2>.35?'#0b1020':'#ffffff')}
  else['--accent','--accent2','--hi','--on'].forEach(k=>st.removeProperty(k));
  set('--fs',SIZES[a.size]||'');set('--ff',FONTS[a.font]||'');set('--fh',FONTS[a.font]||'');
  const d=DENS[a.dens]||DENS.cozy;set('--cp',d[0]);set('--cell',d[1]);
  const r=ROUND[a.round]||ROUND.rounded;set('--r',r[0]);set('--rs',r[1]);
  const isDark=S.theme==='dark'||(S.theme==='auto'&&!!window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
  if(isDark&&okHex(a.bg0)){
    const light=lum(a.bg0)>.4,mix=light?'#000000':'#ffffff';
    set('--bg',a.bg0);set('--panel','color-mix(in srgb,'+a.bg0+' 90%,'+mix+')');set('--line','color-mix(in srgb,'+a.bg0+' 78%,'+mix+')');
    if(light){set('--ink','#12182b');set('--mute','#4a5273')}else{st.removeProperty('--ink');st.removeProperty('--mute')}
  }else['--bg','--panel','--line','--ink','--mute'].forEach(k=>st.removeProperty(k));
  set('--bgimg',a.bg==='glow'?'radial-gradient(900px 420px at 15% -5%,color-mix(in srgb,var(--accent) 22%,transparent),transparent),radial-gradient(800px 380px at 95% 0%,color-mix(in srgb,var(--accent2) 20%,transparent),transparent)':'');
  const fav=document.querySelector('#fav');if(fav)fav.href=S.icon||DEF_FAV;
  const lg=document.querySelector('#logo');if(lg){if(S.icon&&a.logo){lg.src=S.icon;lg.hidden=false}else lg.hidden=true}
}
function applyTheme(){const h=document.documentElement;if(S.theme==='auto')h.removeAttribute('data-theme');else h.setAttribute('data-theme',S.theme)}

// ---------- analytics ----------
function series(t){return (t.hist||[]).map(h=>({y:h.y,e:h.e,rel:S.top[h.y]&&h.e!=null?h.e/S.top[h.y]*100:null})).filter(p=>p.rel!=null).sort((a,b)=>a.y-b.y)}
function proj(t){
  const s=series(t);if(!s.length)return null;
  let w=0,a=0;for(const p of s){const k=Math.pow(.6,NOW-p.y);w+=k;a+=k*p.rel}
  const base=a/w,l=s.slice(-4);let slope=0;
  if(l.length>1){const n=l.length,mx=l.reduce((q,p)=>q+p.y,0)/n,my=l.reduce((q,p)=>q+p.rel,0)/n;let nu=0,de=0;for(const p of l){nu+=(p.y-mx)*(p.rel-my);de+=(p.y-mx)*(p.y-mx)}slope=de?nu/de:0}
  return{p:Math.max(0,Math.min(100,base+.5*slope)),slope,n:s.length,avg:s.reduce((q,p)=>q+p.rel,0)/s.length};
}
function relLatest(t){const s=series(t);return s.length?s[s.length-1].rel:null}
function score(t){
  let a=0,b=0;
  for(const[k]of CR){const r=t.r?.[k]||0;if(r&&S.w[k]){a+=S.w[k]*r;b+=S.w[k]*100}}
  const rl=relLatest(t),p=proj(t);
  if(rl!=null&&S.w.epa){a+=S.w.epa*Math.min(100,rl);b+=S.w.epa*100}
  if(p&&S.w.proj){a+=S.w.proj*p.p;b+=S.w.proj*100}
  return b?Math.round(a/b*100):null;
}
function spark(t){
  const s=series(t);if(!s.length)return '<span class="sub">No history</span>';
  const W=96,H=26,y0=s[0].y,X=y=>2+(y-y0)/(TARGET-y0)*(W-4),Y=v=>H-2-v/100*(H-4),l=s[s.length-1],pr=proj(t);
  const pts=s.map(p=>X(p.y).toFixed(1)+','+Y(p.rel).toFixed(1)).join(' ');
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Percent of each season's top EPA, with a 2027 estimate"><polyline fill="none" stroke="var(--accent)" stroke-width="2" points="${pts}"/><line x1="${X(l.y).toFixed(1)}" y1="${Y(l.rel).toFixed(1)}" x2="${X(TARGET).toFixed(1)}" y2="${Y(pr.p).toFixed(1)}" stroke="var(--accent2)" stroke-width="2" stroke-dasharray="3 2"/></svg>`;
}
const chip=k=>k?`<span class="chip t-${k}">${tierName(k)}</span>`:'<span class="sub">Unsorted</span>';
const hasEpa=t=>t.epa!==''&&t.epa!=null;
function relTxt(t){const top=t.eYear&&S.top[t.eYear];return top&&hasEpa(t)?`<div class="sub" title="Compared with the best EPA that season">${(t.epa/top*100).toFixed(0)}% ${S.topEst[t.eYear]?'of best on your board':'of top'}</div>`:''}
function ebTxt(t){const b=t.eb;if(!b)return '';const p=[['Auto',b.auto],['Tele',b.tele],['End',b.end]].filter(a=>a[1]!=null).map(a=>a[0]+' '+a[1]);return p.length?`<div class="sub">${p.join(' ')}</div>`:''}

// ---------- shell ----------
function collapsify(html){
  // Every card or section whose first child is a heading becomes collapsible; the open/closed state is remembered.
  const re=/(<div class="(?:card|sect)"[^>]*>)\s*(<h[23]\b[^>]*>)([\s\S]*?)(<\/h[23]>)/g;
  let out='',pos=0,m;
  while((m=re.exec(html))){
    const start=m.index,afterHead=re.lastIndex,tags=/<div\b[^>]*>|<\/div>/g;tags.lastIndex=start;
    let depth=0,t,end=-1;
    while((t=tags.exec(html))){depth+=t[0][1]==='/'?-1:1;if(depth===0){end=t.index;break}}
    if(end<0||end<afterHead)continue;
    const id=S.tab+':'+m[3].replace(/<[\s\S]*$/,'').replace(/\s*\(.*\)\s*$/,'').trim();
    const col=!!S.collapsed[id];
    const open=m[1].replace(/class="(card|sect)"/,(a,c)=>`class="${c}${col?' collapsed':''}"`);
    const attrs=` data-sid="${esc(id)}" role="button" tabindex="0" aria-expanded="${!col}"`;
    const h=/class="/.test(m[2])?m[2].replace(/class="([^"]*)"/,(a,c)=>`class="${c} chead"`+attrs):m[2].replace(/<h([23])/,`<h$1 class="chead"`+attrs);
    out+=html.slice(pos,start)+open+h+m[3]+'<span class="chev" aria-hidden="true"></span>'+m[4]+'<div class="cbody">'+html.slice(afterHead,end)+'</div></div>';
    pos=end+6;re.lastIndex=pos;
  }
  return out+html.slice(pos);
}
function wireColl(){

// ---------- Statbotics (EPA) ----------
const SB='https://api.statbotics.io/v3';
let syncing=false;
const bgRender=()=>{if(S.tab!=='videos')render()};
function setSync(m){const e=$('#sync');if(e)e.textContent=m}
const numOf=v=>typeof v==='number'?v:(v&&typeof v==='object'&&typeof(v.mean??v.value)==='number'?(v.mean??v.value):null);
function tyEpa(ty){
  const e=(ty&&ty.epa)||{},b=e.breakdown||{};
  return{epa:numOf(e.total_points),auto:numOf(b.auto_points),tele:numOf(b.teleop_points),end:numOf(b.endgame_points),rank:(((e.ranks||{}).total)||{}).rank??null};
}
async function sbGet(path){
  let r;try{r=await fetch(SB+path)}catch(e){const x=new Error(navigator.onLine?'Could not reach Statbotics. Check your connection and try again.':'You are offline. Saved data is still available.');x.offline=true;throw x}
  if(r.status===404){const x=new Error('none');x.none=true;throw x}
  if(r.status===429){const x=new Error('rate');x.rate=true;throw x}
  if(r.status>=500){const x=new Error('Statbotics server error ('+r.status+') on '+path.split('?')[0]+'.');x.server=true;throw x}
  if(!r.ok)throw new Error('Statbotics returned error '+r.status+' on '+path.split('?')[0]+'.');
  return r.json();
}
async function sbCall(path){
  for(let i=0;i<3;i++){
    try{const d=await sbGet(path);await sleep(120);return d}
    catch(e){
      if(e.rate){setSync('Statbotics asked us to slow down. Waiting a few seconds...');await sleep(5000*(i+1))}
      else if(e.server&&i<2)await sleep(1500*(i+1));
      else throw e;
    }
  }
  throw new Error('Statbotics rate limit is still reached. Try again in a few minutes.');

async function sbSync(force,cap){
  if(syncing)return;
  if(!navigator.onLine){setSync('Offline: using saved EPA data.');return}
  cap=cap||200;sbListBad=false;
  const all=S.teams.filter(t=>force||!t.hist).map(t=>t.num),todo=all.slice(0,cap);
  if(!todo.length){setSync('');return}
  syncing=true;let fails=0,streak=0,last='';
  try{
    for(let i=0;i<todo.length;i++){
      const t=S.teams.find(x=>x.num===todo[i]);if(!t)continue;
      setSync('Statbotics: loading EPA history '+(i+1)+' of '+todo.length+' (team '+t.num+')...');
      try{
        const rows=await teamHist(t.num);
        t.hist=rows.map(r=>({y:r.y,e:r1(r.epa),rk:r.rank}));
        const l=rows[rows.length-1];
        if(l){t.epa=r1(l.epa);t.eb={auto:r1(l.auto),tele:r1(l.tele),end:r1(l.end)};t.eYear=l.y}
        streak=0;
      }catch(e){
        if(e.offline||e.rate)throw e;
        fails++;streak++;last=e.message;
        if(streak>=3)throw new Error(last+' Statbotics looks down right now. Everything else still works, and you can type EPA by hand in a team\'s editor. Try Sync again later.');
      }
      if(i%10===9){save();bgRender()}
    }
    const yrs=[...new Set(S.teams.flatMap(t=>(t.hist||[]).map(h=>h.y)))].filter(y=>force||!S.top[y]||y===NOW||S.topEst[y]);
    for(let i=0;i<yrs.length;i++){
      setSync('Statbotics: finding the top EPA of '+yrs[i]+' ('+(i+1)+' of '+yrs.length+')...');
      const m=await topEpa(yrs[i]);
      if(m>0){S.top[yrs[i]]=m;delete S.topEst[yrs[i]]}
      else{const o=ourMax(yrs[i]);if(o>0){S.top[yrs[i]]=o;S.topEst[yrs[i]]=true}}
    }
    save();bgRender();
    setSync((all.length>cap?'Statbotics: synced '+cap+' teams. '+(all.length-cap)+' remain, so sync again to continue.':'Statbotics: EPA is up to date.')+(fails?' '+fails+' team'+(fails>1?'s':'')+' failed ('+last+') and will be retried next sync.':''));
  }catch(e){save();bgRender();setSync(e.message)}
  syncing=false;
}

function parseTba(ms,team){

function placeText(s){

  if(s.rk)p.push('Qual rank '+s.rk+(s.nt?' of '+s.nt:''));
  if(s.an)p.push('Alliance '+s.an+(PICK[s.ap]||''));

function summarize(items){
  const ev={};let w=0,l=0,t=0;
  for(const i of items){
    if(i.as==null)continue;                                   // not played yet
    const e=ev[i.ev]=ev[i.ev]||{w:0,l:0,t:0};
    if(i.win===true){w++;e.w++}else if(i.win===false){l++;e.l++}else{t++;e.t++}
  }
  return{w,l,t,ev,...topMatches(items)};
}
function topMatches(items){
  const k=items.some(i=>i.d!=null)?'d':'mg';
  const f=a=>a.map(i=>({k:i.k,n:i.n,ev:i.ev,v:i.v,as:i.as,ps:i.ps,d:i.d,mg:i.mg,pw:i.pw,win:i.win,src:i.src,os:i.os,ta:i.ta,tb:i.tb,sd:i.sd}));
  return{
    best:f(items.filter(i=>i[k]!=null&&i[k]>0).sort((a,b)=>b[k]-a[k]).slice(0,3)),
    worst:f(items.filter(i=>i[k]!=null&&i[k]<0).sort((a,b)=>a[k]-b[k]).slice(0,3)),
    upW:f(items.filter(i=>i.win===true&&i.pw!=null&&i.pw<.5).sort((a,b)=>a.pw-b.pw).slice(0,1)),
    upL:f(items.filter(i=>i.win===false&&i.pw!=null&&i.pw>.5).sort((a,b)=>b.pw-a.pw).slice(0,1)),
    pred:items.some(i=>i.src==='sb')?'sb':items.some(i=>i.src==='opr')?'opr':null,
  };
}

function wireUpdates(){
  if(S.tab!=='settings')return;

  const say=m=>{const e=$('#patm');if(e)e.textContent=m};
  let plan=null;
  const gather=async()=>{
    const texts=[],ta=($('#pat').value||'').trim();if(ta)texts.push(ta);
    const files=$('#patf').files||[];for(const f of files)texts.push(await f.text());
    const ps=[];
    for(const t of texts){try{ps.push(await readPatchText(t))}catch(e){throw new Error(e.message==='compact'?'This browser cannot open compact codes. Paste the patch text or choose the file instead.':'That is not a Scouting patch. Paste the text or code you were sent, or choose its file.')}}
    return ps;
  };
  $('#patc').onclick=async()=>{
    plan=null;$('#pata').disabled=true;
    let ps;try{ps=await gather()}catch(e){say(e.message);return}
    if(!ps.length){say('Paste a patch or choose a file first.');return}
    const r=planPatches(ps,st);

    say('Applied. Restarting...');location.reload();
  };
  const bye=list=>{if(list.length)lsSet(PATCH_KEY,list);else lsDel(PATCH_KEY);lsDel(OFF_KEY);location.reload()};
  $('#patr').onclick=()=>{if(st.patches.length&&confirm('Remove the last patch and restart?'))bye(st.patches.slice(0,-1))};

  <div class="bar"><button class="pri" id="tl">Load event teams</button><button id="to">Load event OPRs</button><button id="ta">Load all teams for year</button></div>
  <div class="sub" id="tm" role="status">${esc(tbaMsg)}</div></div>

  <div class="card"><h2>Metric weights</h2>
  <p class="sub" style="margin-top:0">A team's score is the weighted average of everything with a value, out of 100. Ratings count from 1 to 100. EPA vs season top and projected 2027 strength count as their percent of the season's top, also out of 100. Set a weight to 0 to ignore a metric.</p>
  ${WL.map(([k,l])=>`<div class="w"><label for="w-${k}" style="margin:0;color:var(--ink)">${l}</label><input type="range" id="w-${k}" data-w="${k}" min="0" max="5" step="0.5" value="${S.w[k]}"><input type="number" data-wn="${k}" min="0" max="5" step="0.5" value="${S.w[k]}" aria-label="${l} weight"></div>`).join('')}
  <div class="bar"><button id="wr">Reset weights to defaults</button></div></div>

  <div class="card"><h2>Setup</h2>
  <ol class="steps">
  <li>Save <span class="code">frc-prescout-2027.html</span> to your computer and open it in Chrome, Edge or Firefox.</li>
  <li>Above, press <b>Test connection</b>. If it says connected, EPA fills in on its own as teams are added.</li>
  <li>Paste a TBA read key (create one on your TBA account page). Then open the <b>Events</b> tab to pick a year, browse events by week, see who is attending and add them, or type an event key like <span class="code">2026ohcl</span> here and press <b>Load event teams</b>.</li>
  <li>Open the <b>Videos</b> tab, build a queue, and watch clips with notes underneath. Videos work with a TBA key even when Statbotics is down.</li>
  </ol>
  <details><summary>Videos won't play inside the app</summary><p class="sub">YouTube sometimes refuses to play embedded videos in a page opened straight from your disk. Open on YouTube always works. To fix the embed, open a terminal in the folder with the file, run <span class="code">python3 -m http.server 8000</span>, then open <span class="code">http://localhost:8000/frc-prescout-2027.html</span>. Browsers save data per address, so use Data transfer below to move what you have saved.</p></details>
  <details><summary>Data transfer (backup or move to another address)</summary>
  <p class="sub">Everything is saved in this browser. Copy it, download it as a file, or upload a file to replace what is saved here. Your TBA key is not included.</p>
  <div class="bar"><button class="pri" id="dtc">Copy to clipboard</button><button id="dtd">Download file</button><input type="file" id="dtf" accept=".json,.txt,application/json,text/plain" aria-label="Upload a backup file" style="max-width:280px"></div>
  <div class="bar"><label style="margin:0" for="sdn2">Your name on shared team data</label><input id="sdn2" value="${esc(S.me)}" style="max-width:220px" maxlength="60"><button id="rcv2b">Receive team data</button></div>
  <textarea class="mono" id="dt" aria-label="Saved data" placeholder="Your data shows here. You can also paste a copy and press Restore."></textarea>
  <div class="bar"><button id="dts">Show my data</button><button id="dtr" class="bad">Restore from text</button><span class="sub" id="dtm" role="status"></span></div>
  </details></div>

  ${updatesHTML()}

  ${appearanceHTML()}`;
}
function wireSettings(){
  if(!$('#sbt'))return;
  const sbSay=m=>{sbMsg=m;const e=$('#sbm');if(e)e.textContent=m};
  $('#sbo').onchange=e=>{S.on=e.target.checked;save();if(S.on)autoSync()};
  $('#sbs').onclick=()=>sbSync(true,400);
  $('#sbt').onclick=async()=>{
    sbSay('Testing...');
    const out=[];
    const probe=async(label,f)=>{try{out.push(label+': '+await f())}catch(x){out.push(label+': '+(x.none?'not found':x.message))}};
    await probe('Team EPA',async()=>{const e=tyEpa(await sbGet('/team_year/254/2025'));return e.epa!=null?'ok (team 254 in 2025: '+r1(e.epa)+')':'reachable, but the EPA field was not where expected'});
    await probe('Season list',async()=>{const l=await sbGet('/team_years?team=254&limit=1000');return Array.isArray(l)?'ok ('+l.length+' seasons)':'unexpected reply'});
    await probe('Matches',async()=>{const m=await sbGet('/matches?team=254&year=2025&limit=20');const it=parseMatches(Array.isArray(m)?m:[],254);return 'ok ('+it.length+' matches, '+it.filter(i=>i.v).length+' with video)'});
    const down=out.filter(s=>/server error/.test(s)).length;
    sbSay(out.join(' | ')+(down?' | Statbotics is returning server errors, which is a problem on its side (others have reported the same). The app retries, uses fallbacks, and keeps your saved data. Videos, ratings and TBA do not depend on it.':''));
  };
  document.querySelectorAll('[data-ap]').forEach(b=>b.onclick=()=>{const i=b.dataset.ap.indexOf(':'),g=b.dataset.ap.slice(0,i),v=b.dataset.ap.slice(i+1);if(g==='theme')S.theme=v;else S.ap[g]=v;save();render()});
  const apbg=$('#apbgb');if(apbg)apbg.onclick=()=>{S.ap.bg0=$('#apbg').value;save();render()};
  const apc=$('#apc');if(apc)apc.onclick=()=>{S.ap.a=$('#apa').value;S.ap.b=$('#apb').value;S.ap.pal='custom';save();render()};
  const apr=$('#apr');if(apr)apr.onclick=()=>{S.ap=Object.assign({},DEF_AP);S.theme='dark';save();render()};
  const ail=$('#ail');if(ail)ail.onchange=e=>{S.ap.logo=e.target.checked;save();render()};
  const aix=$('#aix');if(aix)aix.onclick=()=>{S.icon='';save();render()};
  const aif=$('#aif');if(aif)aif.onchange=async e=>{
    const f=e.target.files&&e.target.files[0];if(!f)return;
    const say=m=>{const x=$('#aim');if(x)x.textContent=m};
    try{if(!/^image\//.test(f.type))throw new Error('Please choose an image file.');S.icon=await makeIcon(f);save();render();say('Icon updated.')}
    catch(x){say(x.message||'That image could not be read.')}
  };
  const setW=(k,v)=>{v=Math.max(0,Math.min(5,isNaN(v)?0:v));S.w[k]=v;save();const a=$('[data-w="'+k+'"]'),b=$('[data-wn="'+k+'"]');if(a&&+a.value!==v)a.value=v;if(b&&+b.value!==v)b.value=v};
  document.querySelectorAll('[data-w]').forEach(s=>s.oninput=e=>setW(s.dataset.w,+e.target.value));
  document.querySelectorAll('[data-wn]').forEach(s=>s.oninput=e=>{if(e.target.value!=='')setW(s.dataset.wn,+e.target.value)});
  $('#wr').onclick=()=>{S.w=Object.assign({},DEF_W);save();render()};
  const dataText=()=>localStorage.getItem(KEY)||'',dtm=m=>{const e=$('#dtm');if(e)e.textContent=m};
  $('#dts').onclick=()=>{$('#dt').value=dataText();dtm($('#dt').value?'Copy this text.':'Nothing saved yet.')};
  $('#dtc').onclick=async()=>{
    const txt=dataText();if(!txt){dtm('Nothing saved yet.');return}
    $('#dt').value=txt;
    try{await navigator.clipboard.writeText(txt);dtm('Copied '+S.teams.length+' teams to the clipboard.')}catch(e){const t=$('#dt');if(t.select)t.select();dtm('Press Ctrl+C or Cmd+C to copy the selected text.')}
  };
  $('#dtd').onclick=()=>{
    const txt=dataText();if(!txt){dtm('Nothing saved yet.');return}
    try{
      const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));
      a.download='scouting-backup-'+new Date().toISOString().slice(0,10)+'.json';
      document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);dtm('Download started.');
    }catch(e){dtm('Downloads are blocked here. Use Copy to clipboard instead.')}
  };
  const restoreText=(txt,label)=>{
    let d;try{d=JSON.parse(txt)}catch(e){dtm('That is not valid saved data.');return false}
    if(!d||!Array.isArray(d.teams)){dtm('That text has no teams in it.');return false}
    if(!confirm('Replace everything saved here with '+label+' ('+d.teams.length+' teams)?'))return false;
    S.w=Object.assign({},DEF_W);load(d);save();render();return true;
  };
  $('#dtr').onclick=()=>restoreText($('#dt').value,'this text');
  $('#sdn2').oninput=e=>{S.me=String(e.target.value).slice(0,60);save()};
  $('#rcv2b').onclick=receiveDialog;
  $('#dtf').onchange=async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;let txt;try{txt=await f.text()}catch(x){dtm('That file could not be read.');return}$('#dt').value=txt;restoreText(txt,f.name)};
  const tmSay=m=>{tbaMsg=m;const e=$('#tm');if(e)e.textContent=m};
  const key=()=>{
    const k=$('#tk').value.trim();tbaEv=$('#te').value.trim().toLowerCase();tbaYr=$('#ty').value;tbaRem=$('#tr').checked;
    if(!k){tmSay('Enter your TBA read key first.');return null}
    tbaKey=k;try{if(tbaRem)localStorage.setItem(KEY+'-tba',k);else localStorage.removeItem(KEY+'-tba')}catch(e){}return k;
  };
  const get=async(path,k)=>{
    let r;try{r=await fetch(TBA+path,{headers:{'X-TBA-Auth-Key':k}})}catch(e){throw new Error(navigator.onLine?'Could not reach TBA. If this page is hosted on claude.ai, the browser blocks the request: save the file and open it from your own computer.':'You are offline.')}
    if(r.status===401)throw new Error('TBA rejected the key. Check that it is a valid read key.');
    if(r.status===404)throw new Error('Not found. Check the event key or year.');
    if(!r.ok)throw new Error('TBA returned error '+r.status+'.');
    return r.json();
  };
  const run=async f=>{const k=key();if(!k)return;try{await f(k)}catch(x){tmSay(x.message)}};
  const needEv=()=>{if(!tbaEv){tmSay('Enter an event key, like 2026ohcl.');return false}return true};
  $('#tl').onclick=()=>run(async k=>{
    if(!needEv())return;tmSay('Loading teams...');
    const d=await get('/event/'+tbaEv+'/teams/simple',k);
    if(!d.length){tmSay('TBA lists no teams for this event yet.');return}
    let nm='';try{const i=await get('/event/'+tbaEv+'/simple',k);nm=i.short_name||i.name||''}catch(x){}
    const msg=importTeams(d);addEvent(tbaEv,nm,d.map(x=>x.team_number).filter(Boolean));tbaMsg='Event loaded: '+msg;render();autoSync();
  });
  $('#to').onclick=()=>run(async k=>{
    if(!needEv())return;tmSay('Loading OPRs...');
    const d=await get('/event/'+tbaEv+'/oprs',k);
    tmSay(d&&d.oprs&&Object.keys(d.oprs).length?importOprs(d)+(S.events.some(x=>x.key===tbaEv)?'':' Load event teams to add an event subtab.'):'No OPRs yet for this event. It needs completed matches.');
    if(d&&d.oprs)render();
  });
  $('#ta').onclick=()=>run(async k=>{
    const y=parseInt(tbaYr,10);if(!y){tmSay('Enter a year.');return}
    if(!confirm('This loads every team registered for '+y+', about 3,000 teams. Continue?'))return;
    let all=[];for(let p=0;p<20;p++){tmSay('Loading page '+(p+1)+'...');const d=await get('/teams/'+y+'/'+p+'/simple',k);if(!d.length)break;all=all.concat(d)}
    tbaMsg=importTeams(all);render();autoSync();
  });
}

// ---------- wiring ----------
function wire(){
  const q=$('#q');if(q)q.oninput=e=>{S.q=e.target.value;const p=e.target.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p)};
  const tf=$('#tf');if(tf)tf.onchange=e=>{S.tier=e.target.value;render()};
  const so=$('#so');if(so)so.onchange=e=>{S.sort=e.target.value;render()};
  const da=$('#delall');if(da)da.onclick=confirmDeleteAll;
  const rv=$('#rcv');if(rv)rv.onclick=receiveDialog;
  const dor=$('#delorph');if(dor)dor.onclick=confirmDeleteOrphans;
  document.querySelectorAll('tbody tr[data-id]').forEach(r=>{r.onclick=()=>edit(r.dataset.id);r.onkeydown=e=>{if(e.key==='Enter')edit(r.dataset.id)}});
  document.querySelectorAll('[data-c]').forEach(s=>s.onchange=e=>{S.cmp[+s.dataset.c]=e.target.value;render()});
  document.querySelectorAll('[data-cm]').forEach(b=>b.onclick=()=>{S.cmpMode=b.dataset.cm;render()});
  document.querySelectorAll('[data-al]').forEach(s=>s.onchange=e=>{const[i,j]=s.dataset.al.split('-').map(Number);S.al[i][j]=e.target.value;render()});
  const hs=$('#hs');if(hs)hs.onclick=()=>sbSync(true,200);
  const ev=S.events.find(e=>e.key===S.sub);
  if(ev&&$('#eab')){
    $('#eab').onclick=()=>{
      const ns=($('#ea').value.match(/\d+/g)||[]).map(Number).filter(n=>n>0);if(!ns.length)return;
      ns.forEach(n=>{if(!ev.teams.includes(n))ev.teams.push(n);ensureTeam(n)});
      ev.teams.sort((a,b)=>a-b);save();render();autoSync();
    };
    $('#erm').onclick=()=>{if(confirm('Remove this event subtab? The teams stay on your board.')){S.events=S.events.filter(x=>x!==ev);S.sub='';save();render()}};
  }
  wireSettings();wireUpdates();wireEvents();wireVideos();wireTeamPage();wireColl();wireKeyToggle();
}
function wireVideos(){
  if(S.tab!=='videos')return;
  const q=S.queue,i=Math.max(0,Math.min(S.qi,q.length-1)),c=q[i];
  if(c){
    const key=c.n+'|'+c.k;
    if(!S.seen[key]){S.seen[key]=1;save()}
    const go=j=>{S.qi=j;save();render()};
    const p=$('#vp'),n=$('#vnx');
    if(p)p.onclick=()=>go(i-1);if(n)n.onclick=()=>go(i+1);
    const vn=$('#vn');if(vn)vn.oninput=e=>{S.vnotes[key]=e.target.value;save()};
    document.querySelectorAll('[data-vtag]').forEach(b=>b.onclick=()=>{
      const cur=S.vnotes[key]||'',v=cur&&!/\s$/.test(cur)?cur+'; '+b.dataset.vtag:cur+b.dataset.vtag;
      S.vnotes[key]=v;const box=$('#vn');if(box)box.value=v;save();
    });
    ensureClipInfo(c);
    const cp=$('#vcp');if(cp)cp.onclick=()=>{
      const note=(S.vnotes[key]||'').trim(),t=S.teams.find(x=>x.num===c.n);
      if(!note||!t){$('#vcm').textContent='Write a note first.';return}
      const line='['+c.name+'] '+note;
      if(!t.notes.includes(line)){t.notes=t.notes?t.notes+'\n'+line:line;save()}
      $('#vcm').textContent='Added to team '+t.num+' notes.';
    };
  }
  const tm=c&&S.teams.find(x=>x.num===c.n);
  if(tm){
    // These handlers update the page in place and never call render(), so the video keeps playing.
    const setV=(k,v)=>{v=Math.max(0,Math.min(100,Math.round(v)||0));tm.r[k]=v;save();const a=$('[data-vr="'+k+'"]'),b=$('[data-vrn="'+k+'"]');if(a&&+a.value!==v)a.value=v;if(b&&b.value!==String(v||''))b.value=v||'';const s=score(tm),e=$('#vscore');if(e)e.textContent=s==null?'Unrated':s};
    document.querySelectorAll('[data-vr]').forEach(s=>s.oninput=e=>setV(s.dataset.vr,+e.target.value));
    document.querySelectorAll('[data-vrn]').forEach(s=>s.oninput=e=>setV(s.dataset.vrn,e.target.value===''?0:+e.target.value));
    const vtr=$('#vtier');if(vtr)vtr.onchange=e=>{tm.tier=e.target.value;save()};
  }
  document.querySelectorAll('[data-qi]').forEach(b=>b.onclick=()=>{S.qi=+b.dataset.qi;save();render()});
  document.querySelectorAll('[data-qx]').forEach(b=>b.onclick=()=>{S.queue.splice(+b.dataset.qx,1);if(S.qi>=S.queue.length)S.qi=Math.max(0,S.queue.length-1);save();render()});
  const cl=$('#vcl');if(cl)cl.onclick=()=>{S.queue=[];S.qi=0;save();render()};
  const vs=$('#vs');if(vs)vs.onchange=e=>{S.vsrc=e.target.value;render()};
  const vy=$('#vy');if(vy)vy.onchange=e=>{S.vyear=+e.target.value};
  const vt=$('#vt');if(vt)vt.onchange=e=>{S.vteam=e.target.value};
  document.querySelectorAll('[data-vt]').forEach(b=>b.onchange=e=>{S.vt[b.dataset.vt]=e.target.checked});
  const vb=$('#vb');if(vb)vb.onclick=buildQueue;
}
{const mq=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)');if(mq&&mq.addEventListener)mq.addEventListener('change',()=>{if(S.theme==='auto'&&S.ap.bg0)applyAppearance()})}
window.addEventListener('online',()=>{render();autoSync()});
window.addEventListener('offline',()=>render());
render();autoSync();
try{markBootOk()}catch(e){}
<\/script>

<script id="loader">
(function(){
var PK='scouting-patches',BK='scouting-boot',OK='scouting-patch-off',SK='scouting-src',BS='scouting-base';
function h(s){var h1=0xdeadbeef,h2=0x41c6ce57;for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(16)}
function ap(t,ops){for(var i=0;i<ops.length;i++){var o=ops[i];if(!o||typeof o.f!=='string'||!o.f||typeof o.r!=='string')return null;var a=t.indexOf(o.f);if(a<0||t.indexOf(o.f,a+1)>=0)return null;t=t.slice(0,a)+o.r+t.slice(a+o.f.length)}return t}
function jget(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
function jset(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var src=document.getElementById('src').textContent.replace(/<\\\/(script)/gi,'</$1');
var cur=src,applied=[],skipped=[],mode='normal';
var patches=jget(PK),prev=jget(BK),off=jget(OK);
if(!Array.isArray(patches))patches=[];
if(prev&&prev.status==='pending'&&prev.applied&&prev.applied.length&&!off){off={at:new Date().toISOString(),culprit:prev.applied[prev.applied.length-1]};jset(OK,off)}
if(/nopatch/.test((location.hash||'')+(location.search||'')))mode='safe';
else if(off)mode='off';
else{
  for(var i=0;i<patches.length;i++){
    var p=patches[i];
    if(!p||p.requires!==h(cur)){skipped.push({id:p&&p.id,why:'stale'});continue}
    var out=ap(cur,p.ops||[]);
    if(out===null||h(out)!==p.to){skipped.push({id:p.id,why:'bad'});continue}
    cur=out;applied.push(p.id);
  }
}
try{sessionStorage.setItem(SK,cur);sessionStorage.setItem(BS,src)}catch(e){}
jset(BK,{status:'pending',base:h(src),cur:h(cur),applied:applied,skipped:skipped,mode:mode,at:new Date().toISOString()});
var WATCH='<script>window.addEventListener("error",function(e){try{if(e&&e.target&&e.target!==window)return;var b=JSON.parse(localStorage.getItem("scouting-boot")||"{}");if(b.status==="pending"&&!sessionStorage.getItem("scouting-retry")){sessionStorage.setItem("scouting-retry","1");setTimeout(function(){location.reload()},50)}}catch(x){}});<\/script>';
var html=cur.indexOf('<head>')>=0?cur.replace('<head>',function(){return '<head>'+WATCH}):WATCH+cur;
document.write(html);
})();
</script>
